# Site settings
# ---------------------------------------------------------------------------------------

url:                   https://www.mccune.org.uk
baseurl:               ""
lang:                  en
title:                 Rory McCune
description:           >
  Talks, projects and articles on container and Kubernetes security.
logo:                  /assets/img/logo.png

author:
  name:                Rory McCune

# Primary navigation, in order
menu:
  - title:             Blog
    url:               https://raesene.github.io/
  - title:             Projects
    url:               /projects/
  - title:             Code
    url:               /code/
  - title:             Talks
    url:               /talks/
  - title:             Articles
    url:               /articles/
  - title:             Tutorials
    url:               /tutorials/

copyright:             © 2026 Rory McCune

google_analytics:      G-848JF40SB6

# Content
# ---------------------------------------------------------------------------------------

# Talks are posts with `category: talks`
permalink:             /content/:categories/:year-:month-:day-:title/

collections:
  featured_categories:
    permalink:         /:name/
    output:            true
  projects:
    permalink:         /projects/:path/
    output:            true
  code:
    permalink:         /code/:path/
    output:            true

defaults:
  - scope:
      type:            posts
    values:
      layout:          post
  - scope:
      type:            projects
    values:
      layout:          project
      seo:
        type:          WebPage
  - scope:
      type:            code
    values:
      layout:          tool
      seo:
        type:          WebPage
  - scope:
      type:            featured_categories
    values:
      seo:
        type:          WebPage

# Build
# ---------------------------------------------------------------------------------------

markdown:              kramdown
kramdown:
  input:               GFM

exclude:
  - .jekyll-cache
  - .sass-cache
  - vendor
  - Gemfile
  - Gemfile.lock
  - README.md
  - CLAUDE.md

# All on the GitHub Pages plugin whitelist
plugins:
  - jekyll-feed
  - jekyll-redirect-from
  - jekyll-seo-tag
  - jekyll-sitemap
