---
layout: default
---
<article class="doc">
  <div class="measure">
    <header class="doc-head">
      <h1>{{ page.title }}</h1>
      {% if page.description %}<p class="doc-head__lede">{{ page.description | strip_html | strip }}</p>{% endif %}
    </header>
    <div class="doc-grid">
      <div class="prose">
        {{ content }}
      </div>
    </div>
  </div>
</article>
